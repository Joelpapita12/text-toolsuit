<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text ToolSuit</title>
<link rel="icon" href="favicon.png">
<meta name="google-adsense-account" content="ca-pub-1101952476484845">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

  <!-- ADSENSE GLOBAL -->
  <meta name="google-adsense-account" content="ca-pub-1101952476484845">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1101952476484845"
     crossorigin="anonymous"></script>

</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="favicon.png" alt="logo" class="logo-img">
      <span class="logo-text">ToolSuit</span>
    </div>

    <nav>
      <button class="nav-btn active" onclick="showTool('cleaner', this)">
        <span class="nav-icon">⌫</span>
        <span>Text Cleaner</span>
      </button>
      <button class="nav-btn" onclick="showTool('json', this)">
        <span class="nav-icon">{}</span>
        <span>JSON Formatter</span>
      </button>
      <button class="nav-btn" onclick="showTool('case', this)">
        <span class="nav-icon">Aa</span>
        <span>Case Converter</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <a href="pages/about.html">About</a>
      <a href="pages/privacy.html">Privacy</a>
      <a href="pages/contact.html">Contact</a>
    </div>
  </aside>

  <main class="main">

    <!-- CLEANER -->
    <section id="cleaner" class="tool active">
      <div class="tool-header">
        <h1>Text Cleaner</h1>
        <p>Remove noise. Keep signal.</p>
      </div>
      <div class="card">
        <div class="grid">
          <div class="textarea-wrap">
            <label>Input</label>
            <textarea id="input" placeholder="Paste your text here..."></textarea>
          </div>
          <div class="textarea-wrap">
            <label>Output</label>
            <textarea id="output" readonly placeholder="Clean output will appear here..."></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn-primary" id="copy">Copy Output</button>
          <button class="btn-accent" id="humanize">✨ Humanize</button>
          <span class="usage-badge" id="usageBadge"></span>
        </div>
      </div>
    </section>

    <!-- JSON -->
    <section id="json" class="tool">
      <div class="tool-header">
        <h1>JSON Formatter</h1>
        <p>Beautify your JSON instantly.</p>
      </div>
      <div class="card">
        <div class="grid">
          <div class="textarea-wrap">
            <label>Raw JSON</label>
            <textarea id="jsonInput" placeholder='{"key": "value"}'></textarea>
          </div>
          <div class="textarea-wrap">
            <label>Formatted</label>
            <textarea id="jsonOutput" readonly placeholder="Formatted JSON..."></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn-primary" onclick="formatJSON()">Format JSON</button>
          <button class="btn-secondary" onclick="minifyJSON()">Minify</button>
        </div>
      </div>
    </section>

    <!-- CASE -->
    <section id="case" class="tool">
      <div class="tool-header">
        <h1>Case Converter</h1>
        <p>Transform text case in one click.</p>
      </div>
      <div class="card">
        <div class="grid">
          <div class="textarea-wrap">
            <label>Input</label>
            <textarea id="caseInput" placeholder="Type or paste your text..."></textarea>
          </div>
          <div class="textarea-wrap">
            <label>Output</label>
            <textarea id="caseOutput" readonly placeholder="Converted text..."></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn-primary" onclick="toUpper()">UPPERCASE</button>
          <button class="btn-secondary" onclick="toLower()">lowercase</button>
          <button class="btn-secondary" onclick="capitalize()">Capitalize</button>
          <button class="btn-secondary" onclick="toSnake()">snake_case</button>
          <button class="btn-secondary" onclick="toCamel()">camelCase</button>
        </div>
      </div>
    </section>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
